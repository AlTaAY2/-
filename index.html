<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خرائط</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.75);--text:#13262b;--mute:#4d6a70;--acc:#0e8a8c;--acc2:#6a5cff;--tint:rgba(127,200,200,.22);--shadow:0 10px 40px rgba(20,60,70,.25);--tilefx:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(18,32,38,.55);--edge:rgba(255,255,255,.16);--text:#eaf5f5;--mute:#9bbcc0;--acc:#3ed1c4;--acc2:#9a8dff;--shadow:0 10px 40px rgba(0,0,0,.55);--tilefx:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}}
:root[data-theme="dark"]{--glass:rgba(18,32,38,.55);--edge:rgba(255,255,255,.16);--text:#eaf5f5;--mute:#9bbcc0;--acc:#3ed1c4;--acc2:#9a8dff;--shadow:0 10px 40px rgba(0,0,0,.55);--tilefx:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font-family:Tajawal,system-ui,sans-serif;color:var(--text)}
#map{position:fixed;inset:0;direction:ltr}
.leaflet-tile-pane{filter:var(--tilefx)}
.leaflet-control-attribution{font-size:10px;background:var(--glass)!important;color:var(--mute)!important;border-radius:8px 0 0 0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.4)}
#top{position:fixed;z-index:1000;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:560px;margin:0 auto}
#top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 18px;border-radius:27px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 16px Tajawal,sans-serif;color:var(--text)}
.search input::placeholder{color:var(--mute)}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 0 4px var(--tint)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:20px;padding:8px 15px;font:500 14px Tajawal,sans-serif;color:var(--text);cursor:pointer;border:1px solid var(--edge);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
#res{border-radius:22px;max-height:40vh;overflow:auto;display:none;padding:6px}
#res.on{display:block}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;cursor:pointer;border:0;background:none;width:100%;text-align:right;font:inherit;color:inherit}
.row:hover,.row:focus-visible{background:var(--tint);outline:0}
.row b{display:block;font-size:15px}.row small{color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}
.ico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--tint)}
.note{padding:12px;color:var(--mute);font-size:14px}
#tools{position:fixed;z-index:1000;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:10px;transition:bottom .3s}
body.sheet #tools{bottom:calc(env(safe-area-inset-bottom,0px) + 250px)}
.fab{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:20px;color:var(--text);cursor:pointer;font-family:inherit;border-style:solid}
.fab:active{transform:scale(.94)}
#sheet{position:fixed;z-index:1001;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:540px;margin:0 auto;border-radius:28px;padding:18px;transform:translateY(140%);transition:transform .45s cubic-bezier(.22,.9,.2,1)}
#sheet.on{transform:none}
#sheet h2{margin:0 0 2px;font-size:20px}
#sheet .addr{color:var(--mute);font-size:13px;line-height:1.5;max-height:40px;overflow:hidden}
.modes{display:none;gap:8px;margin:12px 0 4px}
.modes.on{display:flex}
.mode{flex:1;height:40px;border-radius:14px;border:0;background:var(--tint);font:500 14px Tajawal,sans-serif;color:var(--text);cursor:pointer}
.mode.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.eta{display:none;gap:10px;margin:10px 0}
.eta.on{display:flex}
.eta div{flex:1;border-radius:16px;padding:10px 12px;background:var(--tint)}
.eta b{display:block;font-size:18px}.eta small{color:var(--mute)}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:48px;border-radius:16px;border:0;font:700 15px Tajawal,sans-serif;cursor:pointer;color:var(--text);background:var(--tint)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;flex:2}
.btn.sq{flex:none;width:48px;font-size:18px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pin{width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,var(--acc),var(--acc2));border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.35);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:17px}
.me{width:18px;height:18px;border-radius:50%;background:#2f7bff;border:4px solid #fff;box-shadow:0 0 0 8px rgba(47,123,255,.25)}
#toast{position:fixed;z-index:2000;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 20px;border-radius:18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}

/* ---- v2: شريط زجاجي + لوحات + حركات ---- */
#tools{bottom:calc(env(safe-area-inset-bottom,0px) + 104px);transition:bottom .4s cubic-bezier(.22,.9,.2,1),opacity .3s}
body.sheet #tools{bottom:calc(env(safe-area-inset-bottom,0px) + 330px)}
#sheet{bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
#sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--mute);opacity:.4;margin:-6px auto 10px}
body:not([data-tab="explore"]) #sheet{transform:translateY(170%)}
body:not([data-tab="explore"]) #tools{opacity:0;pointer-events:none}
#top{transition:opacity .3s,transform .4s}
body:not([data-tab="explore"]) #top{opacity:0;transform:translateY(-24px);pointer-events:none}
body:not([data-tab="explore"]) #top>*{pointer-events:none}
.search{transition:box-shadow .25s}.search:focus-within{box-shadow:0 0 0 3px var(--tint),var(--shadow)}
.pin{animation:drop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes drop{from{transform:rotate(-45deg) scale(0)}to{transform:rotate(-45deg) scale(1)}}
#tabbar{position:fixed;z-index:1100;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:420px;margin:0 auto;height:70px;border-radius:35px;display:flex;padding:6px}
#ind{position:absolute;top:6px;bottom:6px;inset-inline-start:6px;width:calc((100% - 12px)/4);border-radius:29px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 18px rgba(106,92,255,.4);transition:transform .5s cubic-bezier(.34,1.4,.4,1)}
.tab{flex:1;position:relative;z-index:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);font-family:inherit;cursor:pointer;transition:color .3s}
.tab span{font-size:21px;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tab small{font-size:11px;font-weight:500}
.tab.on{color:#fff}.tab.on span{transform:translateY(-1px) scale(1.15)}
.panel{position:fixed;z-index:1002;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);max-width:540px;margin:0 auto;border-radius:30px;padding:20px;overflow:auto;opacity:0;transform:translateY(28px) scale(.97);pointer-events:none;transition:opacity .35s,transform .45s cubic-bezier(.22,.9,.2,1)}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.panel h3{margin:0 0 14px;font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{border:1px solid var(--edge);border-radius:22px;background:var(--tint);padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--text);font:500 15px Tajawal,sans-serif;transition:transform .2s}
.cat:active{transform:scale(.95)}.cat span{font-size:34px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--edge);font-weight:500}
.seg{display:flex;background:var(--tint);border-radius:14px;padding:3px}
.seg button{border:0;background:none;padding:8px 13px;border-radius:11px;font:500 13px Tajawal,sans-serif;color:var(--text);cursor:pointer;transition:background .25s}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.mini{flex:none;height:38px;padding:0 16px;border-radius:12px;border:0;background:var(--tint);color:var(--text);font:500 13px Tajawal,sans-serif;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body data-tab="explore">
<div id="map"></div>

<div id="top">
  <label class="search glass"><span class="dot"></span>
    <input id="q" type="search" placeholder="ابحث عن مكان أو عنوان" autocomplete="off" aria-label="بحث">
  </label>
  <div id="res" class="glass"></div>
  <div class="chips" id="chips"></div>
</div>

<div id="tools">
  <button class="fab glass" id="bIn" aria-label="تكبير">+</button>
  <button class="fab glass" id="bOut" aria-label="تصغير">−</button>
  <button class="fab glass" id="bLoc" aria-label="موقعي">⌖</button>
</div>

<section id="sheet" class="glass" aria-live="polite">
  <h2 id="sName"></h2><div class="addr" id="sAddr"></div>
  <div class="modes" id="modes">
    <button class="mode on" data-m="car">🚗 سيارة</button><button class="mode" data-m="bike">🚲 دراجة</button><button class="mode" data-m="foot">🚶 مشي</button>
  </div>
  <div class="eta" id="eta"><div><b id="eD"></b><small>المسافة</small></div><div><b id="eT"></b><small>المدة</small></div></div>
  <div class="btns">
    <button class="btn p" id="bGo">المسار</button>
    <button class="btn sq" id="bSave" aria-label="حفظ">☆</button>
    <button class="btn sq" id="bShare" aria-label="مشاركة">🔗</button>
    <button class="btn sq" id="bClose" aria-label="إغلاق">✕</button>
  </div>
</section>
<div id="toast" class="glass"></div>

<section class="panel glass" data-p="cats"><h3>الفئات</h3><div class="grid" id="cGrid"></div></section>
<section class="panel glass" data-p="saved"><h3>المحفوظات</h3><div id="sList"></div></section>
<section class="panel glass" data-p="set"><h3>الإعدادات</h3>
  <div class="opt"><span>المظهر</span><div class="seg" data-k="theme"><button data-v="auto">تلقائي</button><button data-v="light">فاتح</button><button data-v="dark">داكن</button></div></div>
  <div class="opt"><span>وحدة المسافة</span><div class="seg" data-k="units"><button data-v="km">كم</button><button data-v="mi">ميل</button></div></div>
  <div class="opt"><span>سجل البحث</span><button class="mini" id="clrRec">مسح</button></div>
  <div class="opt"><span>الأماكن المحفوظة</span><button class="mini" id="clrFav">مسح الكل</button></div>
  <p class="note">بيانات الخرائط © مساهمو OpenStreetMap</p>
</section>

<nav id="tabbar" class="glass" aria-label="التنقل">
  <i id="ind"></i>
  <button class="tab on" data-t="explore"><span>🧭</span><small>استكشاف</small></button>
  <button class="tab" data-t="cats"><span>🧩</span><small>الفئات</small></button>
  <button class="tab" data-t="saved"><span>⭐</span><small>محفوظاتي</small></button>
  <button class="tab" data-t="set"><span>⚙️</span><small>الإعدادات</small></button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================================
   الإعدادات: الواجهة. مزوّد البحث والمسارات يتغير من api/maps.js (السيرفر).
   رابط البلاطات الحقيقي يُضبط من متغير TILES_URL في Vercel.
   ===================================================================== */
const CONFIG = {
  center: [24.7136, 46.6753],   // مركز البداية [خط العرض, خط الطول]
  zoom: 12,
  lang: 'ar',
  tiles: {
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',   // مثال MapTiler: https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?key=مفتاحك
    attribution: '© OpenStreetMap'
  },
  categories: [                  // [الاسم, كلمة البحث, الأيقونة]
    ['مقاهي', 'cafe', '☕'], ['مطاعم', 'restaurant', '🍽'], ['صيدليات', 'pharmacy', '💊'],
    ['وقود', 'fuel', '⛽'], ['صرافات', 'atm', '🏧'], ['مستشفيات', 'hospital', '🏥']
  ]
};

const API = {
  /* كل الطلبات تمر عبر السيرفر (api/maps.js) عشان تخفي المفاتيح وتتجنب مشاكل CORS */
  async search(q, bounds) {
    let u = '/api/maps?type=search&q=' + encodeURIComponent(q);
    if (bounds) u += '&viewbox=' + [bounds.getWest(), bounds.getNorth(), bounds.getEast(), bounds.getSouth()].join(',');
    const r = await fetch(u); if (!r.ok) throw new Error('search');
    return r.json();                       // [{ name, addr, lat, lon }]
  },
  async route(mode, a, b) {
    const r = await fetch('/api/maps?type=route&mode=' + mode + '&from=' + a.lat + ',' + a.lon + '&to=' + b.lat + ',' + b.lon);
    if (!r.ok) throw new Error('route');
    return r.json();                       // { distance, duration, coords: [[lat, lon], ...] }
  }
};

/* ============================ التطبيق ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ar = n => n.toLocaleString('ar-EG');
const map = L.map('map', { zoomControl: false, center: CONFIG.center, zoom: CONFIG.zoom });
const tileLayer = L.tileLayer(CONFIG.tiles.url, { attribution: CONFIG.tiles.attribution, maxZoom: 19 }).addTo(map);
fetch('/api/maps?type=config').then(r => r.json()).then(c => { if (c.tiles) tileLayer.setUrl(c.tiles); }).catch(() => {});
const found = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
let me = null, meMarker = null, cur = null, mode = 'car', timer, curIcon = '📍';

const pinIcon = e => L.divIcon({ className: '', html: '<div class="pin"><span>' + e + '</span></div>', iconSize: [40, 40], iconAnchor: [8, 40] });
const store = {
  get() { try { return JSON.parse(localStorage.getItem('fav') || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem('fav', JSON.stringify(v)); } catch (e) {} }
};
const kv = { get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let units = kv.get('units', 'km');
const fmtD = m => units === 'mi' ? ar(+(m / 1609.34).toFixed(1)) + ' ميل' : m < 1000 ? ar(Math.round(m / 10) * 10) + ' م' : ar(+(m / 1000).toFixed(1)) + ' كم';
const fmtT = s => { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? ar(m) + ' د' : ar(Math.floor(m / 60)) + ' س ' + ar(m % 60) + ' د'; };
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); }

/* الموقع الحالي */
function locate(fly) {
  if (!navigator.geolocation) return toast('المتصفح لا يدعم تحديد الموقع');
  navigator.geolocation.getCurrentPosition(p => {
    me = { lat: p.coords.latitude, lon: p.coords.longitude };
    if (meMarker) meMarker.setLatLng([me.lat, me.lon]);
    else meMarker = L.marker([me.lat, me.lon], { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18] }) }).addTo(map);
    if (fly) map.flyTo([me.lat, me.lon], 15);
  }, () => toast('تعذّر تحديد موقعك، فعّل إذن الموقع'), { enableHighAccuracy: true, timeout: 10000 });
}

/* البحث */
function showRes(list, icon, still) {
  const r = $('res'); r.innerHTML = '';
  if (!list.length) r.innerHTML = '<div class="note">لا توجد نتائج هنا، جرّب كلمة ثانية أو حرّك الخريطة</div>';
  list.forEach(p => {
    const b = document.createElement('button'); b.className = 'row';
    b.innerHTML = '<span class="ico">' + (icon || '📍') + '</span><span><b>' + esc(p.name) + '</b><small>' + esc(p.addr) + '</small></span>';
    b.onclick = () => select(p, icon); r.appendChild(b);
  });
  r.classList.add('on');
  found.clearLayers();
  list.forEach(p => L.marker([p.lat, p.lon], { icon: pinIcon(icon || '📍') }).on('click', () => select(p, icon)).addTo(found));
  if (!still && list.length > 1) map.fitBounds(L.latLngBounds(list.map(p => [p.lat, p.lon])).pad(.2), { maxZoom: 16 });
}
async function run(q, bounds, icon) {
  $('res').innerHTML = '<div class="note">جارٍ البحث…</div>'; $('res').classList.add('on');
  try { showRes(await API.search(q, bounds), icon); } catch (e) { $('res').innerHTML = '<div class="note">تعذّر الاتصال بخدمة البحث، تأكد من الإنترنت</div>'; }
}
$('q').addEventListener('input', () => {
  clearTimeout(timer); const q = $('q').value.trim();
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  if (q.length < 3) return $('res').classList.remove('on');
  timer = setTimeout(() => run(q), 450);
});
CONFIG.categories.forEach(c => {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = c[2] + ' ' + c[0];
  b.onclick = () => { document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); $('q').value = ''; run(c[1], map.getBounds(), c[2]); };
  $('chips').appendChild(b);
});

/* المكان المحدد والمسار */
function isFav(p) { return store.get().some(f => f.lat === p.lat && f.lon === p.lon); }
function select(p, icon) {
  cur = p; curIcon = icon || '📍'; pushRecent(p); $('res').classList.remove('on'); $('q').blur();
  $('sName').textContent = p.name; $('sAddr').textContent = p.addr;
  $('bSave').textContent = isFav(p) ? '★' : '☆';
  $('eta').classList.remove('on'); $('modes').classList.remove('on'); routeLayer.clearLayers();
  $('sheet').classList.add('on'); document.body.classList.add('sheet');
  map.flyTo([p.lat, p.lon], Math.max(map.getZoom(), 15));
}
async function go() {
  if (!cur) return;
  if (!me) { locate(false); toast('جارٍ تحديد موقعك… اضغط المسار مرة ثانية'); return; }
  $('modes').classList.add('on');
  try {
    const r = await API.route(mode, me, cur);
    routeLayer.clearLayers();
    L.polyline(r.coords, { color: '#6a5cff', weight: 7, opacity: .9, lineCap: 'round' }).addTo(routeLayer);
    map.fitBounds(L.latLngBounds(r.coords).pad(.25));
    $('eD').textContent = fmtD(r.distance); $('eT').textContent = fmtT(r.duration); $('eta').classList.add('on');
  } catch (e) { toast('تعذّر حساب المسار'); }
}
$('bGo').onclick = go;
document.querySelectorAll('.mode').forEach(b => b.onclick = () => {
  mode = b.dataset.m; document.querySelectorAll('.mode').forEach(x => x.classList.toggle('on', x === b)); go();
});
$('bClose').onclick = () => { $('sheet').classList.remove('on'); document.body.classList.remove('sheet'); routeLayer.clearLayers(); cur = null; };
$('bSave').onclick = () => {
  if (!cur) return; let f = store.get();
  if (isFav(cur)) { f = f.filter(x => !(x.lat === cur.lat && x.lon === cur.lon)); toast('أُزيل من المحفوظات'); }
  else { f.unshift({ name: cur.name, addr: cur.addr, lat: cur.lat, lon: cur.lon }); toast('تم الحفظ'); }
  store.set(f); $('bSave').textContent = isFav(cur) ? '★' : '☆';
};
$('bShare').onclick = async () => {
  if (!cur) return;
  const u = location.href.split('#')[0] + '#p=' + cur.lat.toFixed(6) + ',' + cur.lon.toFixed(6) + ',' + encodeURIComponent(cur.name);
  try { await navigator.clipboard.writeText(u); toast('تم نسخ الرابط'); } catch (e) { location.hash = u.split('#')[1]; toast('انسخ الرابط من شريط العنوان'); }
};
$('bIn').onclick = () => map.zoomIn(); $('bOut').onclick = () => map.zoomOut(); $('bLoc').onclick = () => locate(true);
map.on('click', () => $('res').classList.remove('on'));

/* فتح رابط مشاركة */
const h = location.hash.match(/^#p=(-?[\d.]+),(-?[\d.]+),?(.*)$/);
if (h) select({ name: decodeURIComponent(h[3] || 'مكان مشترك'), addr: h[1] + ', ' + h[2], lat: +h[1], lon: +h[2] });
else locate(true);

/* ============ v2: التبويبات واللوحات ============ */
const tabs = ['explore', 'cats', 'saved', 'set'];
function tab(n) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.t === n));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.dataset.p === n));
  $('ind').style.transform = 'translateX(' + (-tabs.indexOf(n) * 100) + '%)';
  document.body.dataset.tab = n;
  if (n === 'saved') renderSaved();
  if (n === 'set') renderSet();
  if (n !== 'explore') $('res').classList.remove('on');
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => tab(b.dataset.t));
CONFIG.categories.forEach(c => {
  const b = document.createElement('button'); b.className = 'cat';
  b.innerHTML = '<span>' + c[2] + '</span>' + c[0];
  b.onclick = () => { tab('explore'); $('q').value = ''; run(c[1], map.getBounds(), c[2]); };
  $('cGrid').appendChild(b);
});
function renderSaved() {
  const f = store.get(), l = $('sList'); l.innerHTML = '';
  if (!f.length) { l.innerHTML = '<div class="note">ما عندك أماكن محفوظة بعد. اختر مكانًا واضغط ☆</div>'; return; }
  f.forEach(p => {
    const d = document.createElement('div'); d.className = 'row';
    d.innerHTML = '<span class="ico">⭐</span><span style="flex:1;min-width:0"><b>' + esc(p.name) + '</b><small>' + esc(p.addr) + '</small></span>';
    const x = document.createElement('button'); x.className = 'mini'; x.textContent = '✕'; x.setAttribute('aria-label', 'حذف');
    x.onclick = e => { e.stopPropagation(); store.set(store.get().filter(y => !(y.lat === p.lat && y.lon === p.lon))); renderSaved(); };
    d.onclick = () => { tab('explore'); select(p, '⭐'); };
    d.appendChild(x); l.appendChild(d);
  });
}
function applyTheme(v) { const r = document.documentElement; if (v === 'auto') delete r.dataset.theme; else r.dataset.theme = v; kv.set('theme', v); }
function renderSet() {
  document.querySelectorAll('.seg').forEach(s => {
    const c = s.dataset.k === 'theme' ? kv.get('theme', 'auto') : units;
    s.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === c));
  });
}
document.querySelectorAll('.seg').forEach(s => s.querySelectorAll('button').forEach(b => b.onclick = () => {
  if (s.dataset.k === 'theme') applyTheme(b.dataset.v); else { units = b.dataset.v; kv.set('units', units); }
  renderSet();
}));
$('clrRec').onclick = () => { kv.set('rec', []); toast('تم مسح السجل'); };
$('clrFav').onclick = () => { store.set([]); toast('تم مسح المحفوظات'); };
function pushRecent(p) {
  const r = kv.get('rec', []).filter(x => !(x.lat === p.lat && x.lon === p.lon));
  r.unshift({ name: p.name, addr: p.addr, lat: p.lat, lon: p.lon }); kv.set('rec', r.slice(0, 6));
}
$('q').addEventListener('focus', () => { const r = kv.get('rec', []); if (!$('q').value && r.length) showRes(r, '🕘', true); });
applyTheme(kv.get('theme', 'auto')); tab('explore');
</script>
</body>
</html>
